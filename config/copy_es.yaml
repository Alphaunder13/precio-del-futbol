metodologia:
  titulo: "Metodología"
  intro: "Qué se compara, qué se deja fuera y qué no se puede saber."
  titulo_fuentes: "Todas las fuentes consultadas"
  titulo_descartados: "Clubes revisados que no entran en el ranking"
  tabla_descartados:
    club: "Club"
    ciudad: "Ciudad"
    estado_verificacion: "Estado"
    url_revisada: "Dirección revisada"
    fecha_consulta: "Fecha de consulta"
    nota: "Qué se buscó"
  tabla_fuentes:
    titulo: "Documento"
    url: "Dirección consultada"
    fecha_consulta: "Fecha de consulta"
  secciones:
    - titulo: "Qué mide el número estrella"
      cuerpo: |
        El abono de temporada más barato para un adulto, dividido entre lo que
        gana por hora una persona con el salario bruto medio de la comunidad
        autónoma del club.

        No dice que un aficionado concreto trabaje esas horas. Dice cuántas
        horas de trabajo medio de su territorio cuesta ese abono. Es una unidad
        de comparación entre ciudades, no una medida de esfuerzo personal.
    - titulo: "Qué abono se compara"
      cuerpo: |
        El de temporada completa de liga, para una persona adulta sin ningún
        descuento, en la zona más económica del estadio, al precio que pagaría
        quien se abona por primera vez.

        Cuando el club obliga a pagar una cuota de socio para tener asiento, esa
        cuota se suma: es lo que desembolsa el aficionado.
    - titulo: "Qué queda fuera, y no por descuido"
      cuerpo: |
        Carnés joven, infantil y de mayores. Descuentos por desempleo,
        discapacidad, familia numerosa o antigüedad. Descuentos por ser
        accionista. Promociones y precios de lanzamiento. Palcos, zonas
        preferentes y cualquier localidad con servicios incluidos. Gradas de
        animación y de peñas, porque exigen pertenecer a un colectivo. Zonas de
        movilidad reducida, porque requieren acreditación. Localidades de
        visitante. Abonos de media temporada, de copa o de competición europea.
    - titulo: "Por qué no todos los abonos valen lo mismo aunque cuesten igual"
      cuerpo: |
        No todos cubren los mismos partidos. Hay clubes cuyo abono incluye los
        diecinueve partidos de liga en casa y además la Copa del Rey, y hay al
        menos un club que aparta dos jornadas de liga y las cobra por separado.

        Por eso el precio por partido se divide entre los partidos que cada
        abono cubre de verdad, y no entre diecinueve en todos los casos.
    - titulo: "De dónde salen los salarios"
      cuerpo: |
        Del Instituto Nacional de Estadística, Encuesta Anual de Estructura
        Salarial, salario bruto medio anual por trabajador y comunidad autónoma,
        con datos definitivos de 2024.

        Se descargan de la interfaz de datos del organismo y se procesan sin
        intermediarios, porque durante la construcción se detectó que las
        versiones resumidas de esa tabla circulan con filas desplazadas.

        Se usa bruto y no neto: el neto depende de la situación personal de cada
        contribuyente y no es comparable entre territorios sin suposiciones que
        este trabajo prefiere no hacer.
    - titulo: "Limitaciones que conviene tener presentes"
      cuerpo: |
        La comunidad autónoma es una unidad geográfica gruesa: mete en el mismo
        saco a Getafe y al centro de Madrid, o a Cornellà y a Barcelona.

        El dato salarial es de 2024 y los precios son de la temporada 2026/27.
        No se actualiza a euros de hoy porque hacerlo obligaría a asumir una
        hipótesis de inflación que este trabajo no necesita.

        Varios clubes tienen el aforo de abonados completo y no venden abonos
        nuevos con libertad. El precio existe, pero el producto no está
        realmente disponible para cualquiera.
    - titulo: "Los clubes que no publican su tarifa"
      cuerpo: |
        Durante la recogida aparecieron clubes que publican en abierto las fases
        de la campaña, las fechas, las franjas de edad y hasta las obligaciones
        del abonado, pero no el precio, que solo existe tras identificarse en la
        plataforma de renovación o dentro del proceso de compra.

        Esos clubes no entran en el ranking, porque no hay precio verificable.
        Pero el hecho se publica: forma parte de la respuesta a la pregunta de
        cuánto cuesta ir al fútbol.
    - titulo: "Cómo se recogieron los datos"
      cuerpo: |
        Solo información visible sin iniciar sesión. Nunca se completó un
        proceso de compra ni se creó ninguna cuenta. Se comprobaron las reglas
        de rastreo de cada dominio antes de consultarlo. No se recogió ningún
        dato personal.

        Cada precio guarda la dirección exacta consultada y la fecha, para que
        cualquiera pueda repetir la comprobación.

